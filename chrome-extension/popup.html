<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifiAI Settings</title>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 1rem 0;
      color: #1f2937;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.5rem;
    }
    input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d1d5db;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }
    button {
      width: 100%;
      padding: 0.625rem 1rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      display: none;
    }
    .status.success {
      background-color: #d1fae5;
      color: #065f46;
      display: block;
    }
    .status.error {
      background-color: #fee2e2;
      color: #991b1b;
      display: block;
    }
    .info {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>VerifiAI Settings</h1>
  
  <form id="settings-form">
    <div class="form-group">
      <label for="api-url">API URL</label>
      <input 
        type="text" 
        id="api-url" 
        name="api-url" 
        placeholder="http://localhost:8000"
        required
      />
      <div class="info">Enter your VerifiAI backend API URL</div>
    </div>
    
    <button type="submit">Save Settings</button>
  </form>
  
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
