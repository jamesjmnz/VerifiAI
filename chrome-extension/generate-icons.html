<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Extension Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px;
      display: block;
    }
    button {
      padding: 10px 20px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background: #2563eb;
    }
    .instructions {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <h1>VerifiAI Extension Icon Generator</h1>
  
  <div class="instructions">
    <p><strong>Instructions:</strong></p>
    <ol>
      <li>Click "Generate Icons" below</li>
      <li>Right-click each icon and "Save image as..."</li>
      <li>Save them in the <code>icons/</code> folder as:
        <ul>
          <li><code>icon16.png</code></li>
          <li><code>icon48.png</code></li>
          <li><code>icon128.png</code></li>
        </ul>
      </li>
    </ol>
  </div>

  <button onclick="generateIcons()">Generate Icons</button>

  <div id="icons-container"></div>

  <script>
    function generateIcons() {
      const sizes = [16, 48, 128];
      const container = document.getElementById('icons-container');
      container.innerHTML = '';

      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        canvas.id = `icon${size}`;
        canvas.style.width = `${size * 4}px`;
        canvas.style.height = `${size * 4}px`;
        canvas.style.imageRendering = 'pixelated';

        const ctx = canvas.getContext('2d');
        
        // Draw background (blue gradient)
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#3b82f6');
        gradient.addColorStop(1, '#2563eb');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);

        // Draw shield icon (simple checkmark in shield)
        ctx.strokeStyle = 'white';
        ctx.fillStyle = 'white';
        ctx.lineWidth = Math.max(1, size / 16);

        // Draw shield shape
        const centerX = size / 2;
        const centerY = size / 2;
        const shieldWidth = size * 0.6;
        const shieldHeight = size * 0.7;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY - shieldHeight / 2);
        ctx.quadraticCurveTo(centerX - shieldWidth / 2, centerY - shieldHeight / 2, centerX - shieldWidth / 2, centerY);
        ctx.quadraticCurveTo(centerX - shieldWidth / 2, centerY + shieldHeight / 3, centerX, centerY + shieldHeight / 2);
        ctx.quadraticCurveTo(centerX + shieldWidth / 2, centerY + shieldHeight / 3, centerX + shieldWidth / 2, centerY);
        ctx.quadraticCurveTo(centerX + shieldWidth / 2, centerY - shieldHeight / 2, centerX, centerY - shieldHeight / 2);
        ctx.closePath();
        ctx.stroke();

        // Draw checkmark
        const checkSize = size * 0.3;
        ctx.beginPath();
        ctx.moveTo(centerX - checkSize / 2, centerY);
        ctx.lineTo(centerX - checkSize / 6, centerY + checkSize / 3);
        ctx.lineTo(centerX + checkSize / 2, centerY - checkSize / 3);
        ctx.lineWidth = Math.max(2, size / 12);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        const label = document.createElement('p');
        label.textContent = `${size}x${size} - Right click to save as icon${size}.png`;
        label.style.margin = '5px 0';

        container.appendChild(label);
        container.appendChild(canvas);
      });
    }
  </script>
</body>
</html>
